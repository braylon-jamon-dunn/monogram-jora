name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr lint
      - run: nr typecheck

      # Guard: the committed generated artifacts must match `grammar/jora.ts`.
      - run: nr regen
      - name: Fail if generated artifacts are stale
        run: git diff --exit-code -- grammar

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [24]
        # POSIX only: `build` regenerates via Monogram's CLI, whose `import()` of
        # an absolute path is not Windows-compatible (ERR_UNSUPPORTED_ESM_URL_SCHEME —
        # needs a file:// URL). Generation output is platform-independent and the
        # committed artifacts are what ship, so Windows adds no coverage here.
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr build
      - run: nr test
